<!doctype html>
<html>
  <head>
    <title>PoseNet</title>
  </head>
  <style>
    video,
    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    #toggle,
    #fps {
      position: relative;
      z-index: 10;
    }
  </style>
  <body>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <button id="toggle">Ocultar puntos</button>
    <p id="fps">FPS: 0</p>

    <script type="module" src="app.js"></script>
  </body>
</html>
